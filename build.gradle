plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.fightingstyles'

base { archivesName = 'fightingstyles' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "new" { sourceSet sourceSets.main }
    }
}
